<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I'm Sorry, Nehaaa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Lora:ital,wght@0,400;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#a9d8f5;--bg2:#e6f5fd;--ink:#10304d;--soft:#3f6689;--rose:#2f7fc1;--red:#1f5f9e;--glow:rgba(255,255,255,.75);
--serif:'Lora',Georgia,serif;--head:'Playfair Display',Georgia,serif;--sans:'Jost',system-ui,sans-serif;--hand:'Homemade Apple','Brush Script MT',cursive}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:linear-gradient(180deg,#7fc0ee 0%,#a9d8f5 45%,#e6f5fd 100%) fixed;color:var(--ink);font-family:var(--serif);font-size:1.1rem;line-height:1.8;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:-10%;z-index:0;pointer-events:none;background:radial-gradient(ellipse 30% 9% at 20% 22%,rgba(255,255,255,.75),transparent 70%),radial-gradient(ellipse 36% 10% at 78% 40%,rgba(255,255,255,.6),transparent 70%),radial-gradient(ellipse 32% 9% at 35% 72%,rgba(255,255,255,.65),transparent 70%),radial-gradient(ellipse 28% 8% at 88% 85%,rgba(255,255,255,.55),transparent 70%);animation:drift 60s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-4%)}to{transform:translateX(4%)}}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1}
section{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14vh 1.5rem;max-width:760px;margin:0 auto}
section.wide{max-width:1000px}
h1,h2,.card h3{font-family:var(--head);font-weight:400;line-height:1.15;letter-spacing:.01em}
h1{font-style:italic;font-size:clamp(2.6rem,9.5vw,5rem);text-shadow:0 0 40px var(--glow)}
h2{font-size:clamp(2rem,6.5vw,3.2rem);margin-bottom:2.2rem}
p{margin-bottom:1.3rem;color:var(--ink)}
p.dim{color:var(--soft);font-style:italic}
.sub{font-size:1.15rem;color:var(--soft);margin:2rem 0 3rem;max-width:32ch}
.btn{font-family:var(--sans);font-weight:300;letter-spacing:.08em;font-size:1rem;color:var(--ink);background:transparent;border:1px solid var(--rose);padding:1rem 2.4rem;border-radius:999px;cursor:pointer;transition:.4s;box-shadow:0 0 0 var(--glow)}
.btn:hover,.btn:focus-visible{background:rgba(255,255,255,.55);box-shadow:0 0 30px var(--glow);transform:translateY(-2px)}
:focus-visible{outline:2px solid var(--rose);outline-offset:4px}
/* reveal */
.line{opacity:0;transform:translateY(14px);filter:blur(4px);transition:opacity 1.2s ease,transform 1.2s ease,filter 1.2s ease}
.line.in{opacity:1;transform:none;filter:none}
.locked{display:none}
/* cards */
.cards{display:grid;gap:1.2rem;width:100%}
.card{background:linear-gradient(160deg,rgba(255,255,255,.6),rgba(255,255,255,.3));border:1px solid rgba(47,127,193,.3);box-shadow:0 14px 40px rgba(31,95,158,.12);border-radius:22px;padding:2rem 1.6rem;text-align:left}
.card .ic{font-size:1.6rem}
.card h3{font-weight:500;font-size:1.6rem;margin:.6rem 0 .4rem}
.card p{color:var(--soft);font-size:1.12rem;margin:0}
/* gallery */
.gallery{display:flex;gap:1.2rem;overflow-x:auto;scroll-snap-type:x mandatory;width:100vw;padding:1rem 1.5rem 2rem;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
figure{flex:0 0 min(78vw,320px);scroll-snap-align:center}
figure .ph{aspect-ratio:3/4;border-radius:18px;background:linear-gradient(150deg,#ffffff,#cfe8f8);border:1px solid rgba(47,127,193,.3);display:grid;place-items:center;color:var(--soft);font-size:2rem;overflow:hidden;box-shadow:0 20px 50px rgba(31,95,158,.25)}
figure img{width:100%;height:100%;object-fit:cover;display:block}
figcaption{margin-top:.9rem;font-style:italic;color:var(--soft);font-size:1.1rem}
.hint{font-family:var(--sans);font-size:.8rem;color:var(--soft);opacity:.7}
/* promises */
ul.pro{list-style:none;margin:0 0 2.5rem;text-align:left;display:inline-block}
ul.pro li{font-size:1.5rem;padding:.35rem 0}
/* letter */
.paper{background:rgba(255,255,255,.55);border:1px solid rgba(47,127,193,.25);border-radius:14px;padding:2.4rem 1.6rem;text-align:left;font-family:var(--hand);font-size:1rem;line-height:2.3;color:#16385a;box-shadow:0 30px 80px rgba(31,95,158,.2);width:100%}
.paper p{font-size:inherit;color:inherit;margin-bottom:1.2rem}
/* finale */
#final h2{font-size:clamp(2.4rem,8vw,4rem)}
#reveal{display:none;margin-top:2rem}
#reveal.show{display:block;animation:rise 2.4s ease both}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.97);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
/* chrome */
#bar{position:fixed;top:0;left:0;height:2px;width:0;background:linear-gradient(90deg,var(--red),var(--rose));z-index:10;box-shadow:0 0 10px var(--glow)}
#mute{position:fixed;right:max(1rem,env(safe-area-inset-right));bottom:max(1rem,env(safe-area-inset-bottom));z-index:10;width:44px;height:44px;border-radius:50%;border:1px solid rgba(47,127,193,.5);background:rgba(255,255,255,.65);color:var(--ink);font-size:1.1rem;cursor:pointer;backdrop-filter:blur(6px)}
footer{position:relative;z-index:1;text-align:center;padding:3rem 1rem 4rem;font-family:var(--sans);font-size:.85rem;color:var(--soft);font-weight:300}
@media(min-width:760px){.cards{grid-template-columns:repeat(3,1fr)}.paper{padding:3.5rem;font-size:1.15rem}body{font-size:1.2rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}.line{opacity:1;transform:none;filter:none}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="bar" role="progressbar" aria-label="Reading progress"></div>
<button id="mute" aria-label="Turn music on" title="Music">♪</button>
<audio id="music" loop preload="none"></audio>

<main id="app"></main>
<footer id="foot"></footer>

<script>
/* =====================================================
   EDIT EVERYTHING HERE — name, photos, captions, music
   ===================================================== */
const CONFIG = {
  herName: "Nehaaa",                 // shown in the footer
  musicUrl: "",                       // e.g. "piano.mp3" (put file next to this html). Leave "" for no music.
  photos: [                           // set src to your photo path, e.g. "photos/us1.jpg"
    { src: "", caption: "One of my favorite memories." },
    { src: "", caption: "A moment I'll always remember." },
    { src: "", caption: "You make ordinary moments special." },
    { src: "", caption: "Us ❤️" }
  ],
  cards: [
    ["💔","I hurt you","I understand that my actions affected you, and I'm sorry for putting you through that."],
    ["🥺","I should have done better","I should have thought about your feelings before acting, and I regret that I didn't."],
    ["❤️","You matter to me","You are incredibly important to me, and I never want you to feel like your feelings don't matter to me."]
  ],
  promises: ["Listen better.","Think before I act.","Respect your feelings.","Show you through my actions, not just words."],
  letter: [
    "Nehaaa,","I'm really sorry.",
    "I know I messed up, and I've spent a lot of time thinking about how my actions made you feel.",
    "You didn't deserve to be hurt by me.",
    "I wish I could go back and handle things differently, but I can't change what already happened.",
    "What I can do is learn from it.",
    "I don't expect one website, one message, or one apology to suddenly make everything okay.",
    "I just wanted to create this little corner of the internet to tell you something from my heart:",
    "I'm sorry.",
    "I'm sorry for hurting you.<br>I'm sorry for disappointing you.<br>And I'm sorry for making you feel anything less than loved and valued.",
    "You mean so much to me.",
    "And if you give me the chance, I want to show you that I can do better — not just say it.",
    "❤️"
  ]
};

/* ---------- build the page ---------- */
const L = (t,c="") => `<p class="line ${c}">${t}</p>`;
const $ = s => document.querySelector(s);
$('#app').innerHTML = `
<section id="landing">
  <h1 class="line">I'm Sorry, Nehaaa. ❤️</h1>
  <p class="sub line">I know I messed up.<br>And I know saying sorry doesn't magically fix everything, but I still want you to know how truly sorry I am.</p>
  <button class="btn line" id="open">Open My Heart ❤️</button>
</section>
<div id="rest" class="locked">
<section id="s1"><h2 class="line">I Owe You an Apology</h2>
  ${L("I've been thinking about what happened, and I realize that I hurt someone who means more to me than I can properly put into words.")}
  ${L("I know I messed up. I know an “I'm sorry” can feel too small when someone has been hurt.")}
  ${L("I'm not here to make excuses or justify what I did.")}
  ${L("I just want to take responsibility and tell you that I am genuinely sorry.")}
</section>
<section id="s2" class="wide"><h2 class="line">I Understand</h2>
  <div class="cards">${CONFIG.cards.map(c=>`<article class="card line"><div class="ic" aria-hidden="true">${c[0]}</div><h3>${c[1]}</h3><p>${c[2]}</p></article>`).join("")}</div>
</section>
</div>`;
$('#foot').textContent = `Made with ❤️ for ${CONFIG.herName}`;

/* ---------- reveal on scroll (staggered) ---------- */
const io = new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting) return;
  const sib=[...e.target.parentElement.querySelectorAll(':scope > .line')];
  e.target.style.transitionDelay = Math.max(0,sib.indexOf(e.target))*0.35+'s';
  e.target.classList.add('in'); io.unobserve(e.target);
}),{threshold:.25});
const watch=()=>document.querySelectorAll('.line:not(.in)').forEach(el=>io.observe(el));
watch();

/* ---------- interactions ---------- */
$('#open').onclick=()=>{ $('#rest').classList.remove('locked'); watch();
  setTimeout(()=>$('#s1').scrollIntoView({behavior:'smooth'}),80); };

const bar=$('#bar');
addEventListener('scroll',()=>{const h=document.documentElement;
  bar.style.width=(scrollY/Math.max(1,h.scrollHeight-innerHeight)*100)+'%';},{passive:true});

/* ---------- music (opt-in only, never autoplays) ---------- */
const audio=$('#music'), mute=$('#mute'); let on=false;
if(CONFIG.musicUrl) audio.src=CONFIG.musicUrl;
mute.onclick=()=>{
  if(!CONFIG.musicUrl){mute.title="Add musicUrl in CONFIG";return;}
  on=!on; on?audio.play().catch(()=>{}):audio.pause();
  mute.textContent=on?'♪':'✕'; mute.setAttribute('aria-label',on?'Mute music':'Turn music on');
};
mute.textContent='✕';

/* ---------- floating hearts & glow particles ---------- */
const cv=$('#fx'),cx=cv.getContext('2d');let W,H,ps=[];
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
const size=()=>{const d=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*d;H=cv.height=innerHeight*d;};
size();addEventListener('resize',size);
const N=innerWidth<600?22:40;
const mk=(burst,x,y)=>({x:x??Math.random()*W,y:y??(burst?H/2:H+Math.random()*H*.3),r:(Math.random()*2+1)*(W/900+1),
  v:burst?-(Math.random()*3+1):-(Math.random()*.4+.15),dx:(Math.random()-.5)*(burst?3:.3),a:Math.random()*.5+.15,
  heart:Math.random()<.22,ph:Math.random()*6.28});
for(let i=0;i<N;i++){const p=mk();p.y=Math.random()*H;ps.push(p);}
function heart(x,y,s){cx.beginPath();cx.moveTo(x,y+s*.35);
  cx.bezierCurveTo(x-s,y-s*.4,x-s*.5,y-s*1.1,x,y-s*.5);
  cx.bezierCurveTo(x+s*.5,y-s*1.1,x+s,y-s*.4,x,y+s*.35);cx.fill();}
function burst(){for(let i=0;i<40;i++)ps.push(mk(true,W/2,H*.6));}
(function loop(t){cx.clearRect(0,0,W,H);
  ps.forEach((p,i)=>{ if(!still){p.y+=p.v;p.x+=p.dx+Math.sin(t/1800+p.ph)*.25;}
    cx.fillStyle=`rgba(255,255,255,${p.a+.25})`;cx.shadowColor='rgba(47,127,193,.6)';cx.shadowBlur=p.heart?14:10;
    if(p.heart)heart(p.x,p.y,p.r*4);else{cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.28);cx.fill();}
    if(p.y<-30||p.x<-30||p.x>W+30){ if(ps.length>N&&i>=N){ps.splice(i,1);} else Object.assign(p,mk()); }});
  if(!still)requestAnimationFrame(loop);
  })(0);
if(still){/* draw one static frame */}
</script>
</body>
</html>
